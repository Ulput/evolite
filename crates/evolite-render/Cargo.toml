[package]
name = "evolite-render"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Turns untrusted pictures (NFT art) into checked RGBA frames, in a separate process."

[dependencies]
crc32fast = "1.5"
# Pure-Rust decoders only: a bug in them is a wrong picture or a refusal, not memory corruption.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
miniz_oxide = "0.8"
# The same resvg/usvg as egui_extras; system fonts for <text>, embedded rasters for data: URIs.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplecss = "0.2"
svgtypes = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    # SetErrorMode: a worker over the memory cap ends at once, without Windows Error Reporting.
    "Win32_System_Diagnostics_Debug",
    # The tests check that executable memory is refused inside the sandbox.
    "Win32_System_Memory",
    # IO_COUNTERS inside JOBOBJECT_EXTENDED_LIMIT_INFORMATION.
    "Win32_System_Threading",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
