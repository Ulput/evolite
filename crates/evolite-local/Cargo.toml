[package]
name = "evolite-local"
description = "The files of a wallet's folder: the vault, the list of wallets, the journal, notes and the small JSON files. No Platform stack."
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
evolite-api = { path = "../evolite-api" }
evolite-common = { path = "../evolite-common" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The vault: RustCrypto's audited AES-GCM and Argon2, secrets in Zeroizing.
aes-gcm = "0.10"
# The notes' key, derived with HKDF.
hkdf = "0.12"
# `zeroize`: Argon2's working memory (64 MiB derived from the password) is wiped (SEC-5, П5).
argon2 = { version = "0.5", features = ["zeroize"] }
getrandom = "0.3"
zeroize = "1"
sha2 = { version = "0.10", default-features = false }
# The rates over https only (rustls); already in the tree through Platform.
ureq = "3"
# Р1: the update check compares versions as semver (prerelease tags too).
semver = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time", "net"] }
# Р1: the update check's signature (minisign, Ed25519), verify only, no dependencies; pinned
# exactly (review REL-verify-design r1; the customer allowed the download 2026-11-20).
minisign-verify = "=0.3.0"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# Р1 tests sign their own minisign files (both already in the lock, through dpp and dash-spv).
ed25519-dalek = "=2.2.0"
blake2b_simd = "=1.0.5"

[lints]
workspace = true
