[package]
name = "evolite-memlock"
description = "The open wallet's phrase and seed in memory locked to RAM (SEC-5): the one crate of the core with unsafe code, a page of its own, nothing else."
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The journal's one `memlock` line per run.
evolite-common = { path = "../evolite-common" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
